<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f2f4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>%BRAND_NAME% — Football player profiles, market values & transfers</title>
    <meta name="description" content="%BRAND_DESCRIPTION%" />
    <meta property="og:title" content="%BRAND_NAME% — %BRAND_TAGLINE%" />
    <meta
      property="og:description"
      content="Market values, transfers, honours and injuries for every player, in one place."
    />
    <meta property="og:type" content="website" />

    <!-- Warm the connections the first render needs before it asks for them. -->
    <link rel="preconnect" href="https://transfermarkt-api-82dl.onrender.com" />
    <link rel="dns-prefetch" href="https://tmssl.akamaized.net" />
    <link rel="dns-prefetch" href="https://img.a.transfermarkt.technology" />
    <link rel="dns-prefetch" href="https://flagcdn.com" />

    <style>
      /* Painted before React boots, in the page colour, so there is no flash. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f1f2f4;
        z-index: 60;
        transition: opacity 0.35s ease;
      }
      #boot span {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 3px solid rgba(11, 12, 14, 0.12);
        border-top-color: #0b0c0e;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #root:not(:empty) + #boot {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><span></span></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
