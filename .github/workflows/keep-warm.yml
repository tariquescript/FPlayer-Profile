name: Keep the data service awake

# Render's free plan puts the Transfermarkt API to sleep after 15 minutes
# without traffic, and the next visitor then waits 30–60 s for it to wake.
# A request every 10 minutes keeps it up. Free: scheduled workflows cost
# nothing on public repositories, and one always-on service fits inside
# Render's free 750 instance-hours a month.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the Transfermarkt API
        run: >
          curl --silent --output /dev/null --max-time 90
          --write-out 'HTTP %{http_code} in %{time_total}s\n'
          https://transfermarkt-api-82dl.onrender.com/ || true
