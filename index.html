<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04060b" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <title>PlayerIndex — Football player profiles, market values & transfers</title>
    <meta
      name="description"
      content="Search any footballer and get market value history, transfers, honours, injuries and shirt numbers in one fast profile."
    />
    <meta property="og:title" content="PlayerIndex — Football player profiles" />
    <meta
      property="og:description"
      content="Market values, transfers, honours and injuries for every player, in one place."
    />
    <meta property="og:type" content="website" />

    <!-- Warm the connections the first render needs before it asks for them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://transfermarkt-api-82dl.onrender.com" />
    <link rel="dns-prefetch" href="https://tmssl.akamaized.net" />
    <link rel="dns-prefetch" href="https://img.a.transfermarkt.technology" />
    <link rel="dns-prefetch" href="https://flagcdn.com" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
    />

    <style>
      /* Painted before React boots so the page is never a white flash. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #04060b;
        z-index: 60;
        transition: opacity 0.4s ease;
      }
      #boot span {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(52, 211, 153, 0.25);
        border-top-color: #34d399;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #root:not(:empty) + #boot {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><span></span></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
